name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: Security & Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify no forbidden sensitive files are tracked
        run: |
          FORBIDDEN=$(git ls-files | grep -E '(^|/)(local\.properties|secrets\.properties|signing\.properties|keystore\.properties|\.env(\..*)?|google-services\.json|service-account.*\.json|.*\.(jks|keystore|p12|pfx|pem|key|crt|cer|drp|db|sqlite|sqlite3))$' || true)
          if [ -n "$FORBIDDEN" ]; then
            echo "Forbidden sensitive files found in repository:"
            echo "$FORBIDDEN"
            exit 1
          fi

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks across repository history
        run: |
          gitleaks detect --source . --config .gitleaks.toml --redact --verbose

  unit-and-ui-snapshot:
    name: Unit Tests & Roborazzi UI Snapshots
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run JVM & Robolectric unit tests (L1/L2/L3)
        run: ./gradlew :core:model:test :core:domain:test :core:network:test testDebugUnitTest --stacktrace

      - name: Verify Roborazzi UI golden snapshots
        run: ./gradlew :app:verifyRoborazziDebug --stacktrace

      - name: Upload Compose UI snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-ui-snapshots
          path: |
            app/src/test/snapshots/*.png
            app/build/outputs/roborazzi/**
          retention-days: 14

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/**
          retention-days: 14

  build-and-emulator-e2e:
    name: Build Debug APK & API 31 Emulator E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM for hardware-accelerated emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Cache AVD snapshot
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api31-google_apis-x86_64-v1

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run API 31 Emulator E2E tests (L4)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Build Debug APK
        run: |
          ./gradlew :app:assembleDebug --stacktrace
          ls -lh app/build/outputs/apk/debug/droplet-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: droplet-debug-apk
          path: app/build/outputs/apk/debug/droplet-debug.apk
          retention-days: 14

      - name: Upload AndroidTest E2E reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-reports
          path: app/build/reports/androidTests/connected/**
          retention-days: 14
